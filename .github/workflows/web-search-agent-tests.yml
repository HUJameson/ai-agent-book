name: web-search-agent tests

on:
  pull_request:
    paths:
      - "chapter1/web-search-agent/**"
      # The chapter imports agentbook.providers, so a change there can break
      # these tests without touching the chapter directory at all.
      - "agentbook/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/web-search-agent-tests.yml"
  push:
    branches: [main]
    paths:
      - "chapter1/web-search-agent/**"
      - "agentbook/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/web-search-agent-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapter1/web-search-agent

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chapter1/web-search-agent/requirements.txt
            chapter1/web-search-agent/webui/requirements.txt

      - name: Install dependencies
        # webui 是本章节的一部分（FastAPI GUI），其可选依赖必须一并安装，
        # 否则 tests/test_webui.py 在收集阶段就会 ImportError。
        run: python -m pip install -r requirements.txt -r webui/requirements.txt

      - name: Check formatting
        run: python -m black --check tests webui

      - name: Run offline unit tests
        env:
          MOONSHOT_API_KEY: ""
          KIMI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: python -m pytest

  # The shared provider registry has its own suite at the repository root.
  # Without this job a change to agentbook/ could only be caught indirectly,
  # via whichever chapter happened to import the broken code.
  agentbook:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        # This job runs all root tests, including the MkDocs source-link tests.
        run: python -m pip install -e ".[dev]" "mkdocs>=1.6,<2"

      - name: Run registry tests
        env:
          MOONSHOT_API_KEY: ""
          KIMI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: python -m pytest tests -q
