name: secrets scan (gitleaks)

# 增量扫描策略：上游 git 历史已存在大量命中（validation 证据中的占位 key
# 与服务端标识符，部分已由 .gitleaks.toml 放行），因此只扫描新增提交，
# 不对历史全量负责。全量扫描请本地执行：gitleaks detect --source .
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks 解析提交区间需要 git 历史

      - name: Compute scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          else
            # 首次推送 / 手动触发：只扫最新提交，避免放大到历史
            echo "log_opts=-1 HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks detect
        run: |
          echo "扫描区间: ${{ steps.range.outputs.log_opts }}"
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks:v8.30.1 detect \
            --source /repo --redact --verbose \
            --log-opts="${{ steps.range.outputs.log_opts }}"
